const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open_(pw){
  const k0 = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(D.salt), iterations:D.iter, hash:"SHA-256"},
                                          k0, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(D.iv)}, k, b64(D.ct));
  const html = new TextDecoder().decode(pt);
  try { sessionStorage.setItem("poms_pw", pw); } catch(_){}
  document.open(); document.write(html); document.close();   // ページ内のスクリプト（地図・グラフ）も動かすため
}
function stored(){ let p = null;
  try { p = sessionStorage.getItem("poms_pw"); } catch(_){}
  if (!p) { try { p = localStorage.getItem("poms_pw"); } catch(_){} }
  return p; }
document.getElementById("f").addEventListener("submit", async e => { e.preventDefault();
  const pw = document.getElementById("pw").value;
  try { if (document.getElementById("keep").checked) { try { localStorage.setItem("poms_pw", pw); } catch(_){} }
        await open_(pw); }
  catch(_) { try { localStorage.removeItem("poms_pw"); } catch(__){}
             document.getElementById("err").style.display = "block"; } });
(async () => { const pw = stored();
  if (pw) { try { await open_(pw); return; } catch(_){
    try { sessionStorage.removeItem("poms_pw"); localStorage.removeItem("poms_pw"); } catch(__){} } }
  document.getElementById("f").style.display = "block"; document.getElementById("pw").focus(); })();
